# Local stack: object storage, warehouse, orchestrator, tracking server (design 6.2).
services:
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

  create-buckets:
    image: amazon/aws-cli:2.31.5
    depends_on: [minio]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      sh -c "until aws --endpoint-url http://minio:9000 s3 ls; do sleep 1; done;
             for b in dvc mlflow; do aws --endpoint-url http://minio:9000 s3 mb s3://$$b || true; done"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5433:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 5s
      retries: 20

  mlflow:
    build: {context: docker, dockerfile: mlflow.Dockerfile}
    depends_on:
      postgres: {condition: service_healthy}
      create-buckets: {condition: service_completed_successfully}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/mlflow
      --artifacts-destination s3://mlflow --serve-artifacts
      --allowed-hosts localhost:5001,127.0.0.1:5001,mlflow:5000
    ports: ["5001:5000"]

  airflow:
    image: apache/airflow:3.3.1
    command: standalone
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      PYTHONPATH: /opt/ukwiki/src
      DATA_DIR: /opt/ukwiki/data
      WAREHOUSE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/warehouse
      WIKI_CONTACT: ${WIKI_CONTACT}
      USER_HASH_SALT: ${USER_HASH_SALT}
    ports: ["8080:8080"]
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/ukwiki/src:ro
      - ./data:/opt/ukwiki/data

volumes:
  minio:
  postgres:
