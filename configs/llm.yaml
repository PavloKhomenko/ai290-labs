# Lab 3: every setting of the LLM component, read by indexing, evaluation and (Lab 4) serving.
# Changing an `index` value changes the index hash: `make index` builds it next to the old one.
corpus: corpus/policies.jsonl

index:
  chunk_size: 800          # characters
  chunk_overlap: 100       # characters
  embedding_model: intfloat/multilingual-e5-small

retrieval:
  top_k: 5

llm:                       # OpenAI-compatible endpoint; Lab 4 calls the same URL from the cluster
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
  api_key_env: GEMINI_API_KEY
  model: gemini-3.5-flash-lite   # pinned name, not a *-latest alias that can change underneath
  temperature: 0.0
  max_tokens: 400
  usd_per_mtok_in: 0.30    # list price, ai.google.dev/gemini-api/docs/pricing, 2026-11-16
  usd_per_mtok_out: 2.50

judge:                     # a different, larger model than the answerer (self-preference bias)
  model: gemini-3.6-flash  # 3.5-flash is deprecated and silently routed to 3.6, so pin 3.6
  temperature: 0.0
  max_tokens: 1024         # includes the judge's reasoning tokens
  usd_per_mtok_in: 0.75    # introductory price until 2026-12-31
  usd_per_mtok_out: 7.50

prompts:
  closed_book: prompts/closed_book.md
  answer: prompts/answer.md
  judge: prompts/judge.md

eval_set: eval/policy_qa.jsonl
